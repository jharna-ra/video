<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GPS Map Camera — GeoTag</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  min-height:100%;
  margin:0;
  padding:0;
}

body{
  background:#0b1015;
  color:#eef2f7;
  font-family:Arial,Helvetica,sans-serif;
}

/* =========================
   MAIN GEOTAG PAGE
   ========================= */

#geoPage{
  display:block;
  width:100%;
  min-height:100vh;
  margin:0 !important;
  padding:0 !important;
  overflow-x:hidden;
}

/* =========================
   FULL WIDTH WORKSPACE
   ========================= */

.geo-layout{
  width:100%;
  min-height:100vh;
  margin:0 !important;
  padding:0 !important;

  display:grid;
  grid-template-columns:360px minmax(0,1fr);
}

/* =========================
   LEFT CONTROL PANEL
   ========================= */

.controls{
  width:100%;
  min-height:100vh;
  margin:0;
  padding:20px;
  background:#111820;
  border-right:1px solid #26313c;
  overflow-y:auto;
}

.controls h1{
  font-size:22px;
  margin-bottom:5px;
}

.controls .subtitle{
  color:#8e9aa7;
  font-size:13px;
  margin-bottom:20px;
}

.control-group{
  margin-bottom:17px;
}

.control-group label{
  display:block;
  margin-bottom:7px;
  font-size:13px;
  font-weight:700;
  color:#dce4eb;
}

select,
input,
textarea{
  width:100%;
  border:1px solid #34414e;
  border-radius:7px;
  background:#18212a;
  color:#fff;
  outline:none;
  font-family:inherit;
}

select,
input{
  height:42px;
  padding:0 11px;
}

textarea{
  min-height:78px;
  resize:vertical;
  padding:10px 11px;
  line-height:1.4;
}

select:focus,
input:focus,
textarea:focus{
  border-color:#3b82f6;
}

/* Buttons */

button{
  font-family:inherit;
}

.primary-btn{
  width:100%;
  height:44px;
  border:0;
  border-radius:7px;
  background:#2563eb;
  color:#fff;
  font-weight:700;
  cursor:pointer;
  transition:.2s;
}

.primary-btn:hover{
  background:#1d4ed8;
}

.secondary-btn{
  width:100%;
  height:42px;
  border:1px solid #394653;
  border-radius:7px;
  background:#18212a;
  color:#fff;
  font-weight:600;
  cursor:pointer;
}

.secondary-btn:hover{
  background:#202b36;
}

/* =========================
   SLIDERS
   ========================= */

.slider-row{
  display:grid;
  grid-template-columns:1fr 48px;
  gap:10px;
  align-items:center;
}

input[type="range"]{
  width:100%;
  height:5px;
  padding:0;
  border:0;
  background:#34414e;
  accent-color:#3b82f6;
}

.value{
  height:30px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:5px;
  background:#18212a;
  color:#dce4eb;
  font-size:12px;
}

/* =========================
   RIGHT PREVIEW AREA
   ========================= */

.preview-area{
  width:100%;
  min-width:0;
  min-height:100vh;
  margin:0 !important;
  padding:20px !important;
  background:#0b1015;
}

.preview-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
  margin-bottom:15px;
}

.preview-header h2{
  font-size:18px;
}

.file-label{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:40px;
  padding:0 15px;
  border:1px solid #34414e;
  border-radius:7px;
  background:#18212a;
  color:#fff;
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}

#imageInput{
  display:none;
}

/* =========================
   PREVIEW FRAME
   ========================= */

.preview-box{
  width:100%;
  min-height:calc(100vh - 90px);
  margin:0 !important;
  padding:0 !important;

  display:flex;
  align-items:flex-start;
  justify-content:center;

  background:#080c10;
  border:1px solid #202b35;
  border-radius:10px;
  overflow:auto;
}

/* Canvas */
#geoCanvas{
  display:block;
  max-width:100%;
  width:auto;
  height:auto;
  margin:0 auto;
}

/* Empty state */

.empty-state{
  min-height:400px;
  width:100%;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  color:#7e8a96;
  text-align:center;
  padding:30px;
}

.empty-state strong{
  color:#dce4eb;
  font-size:17px;
  margin-bottom:7px;
}

.empty-state span{
  font-size:13px;
}

/* =========================
   MOBILE
   ========================= */

@media(max-width:850px){

  .geo-layout{
    grid-template-columns:1fr;
  }

  .controls{
    min-height:auto;
    border-right:0;
    border-bottom:1px solid #26313c;
  }

  .preview-area{
    min-height:auto;
    padding:12px !important;
  }

  .preview-box{
    min-height:400px;
  }

  .preview-header{
    flex-direction:column;
    align-items:stretch;
  }

}
</style>

<script>
/* =========================================================
   ELEMENTS
   ========================================================= */

const imageInput = document.getElementById("imageInput");
const imageInput2 = document.getElementById("imageInput2");

const canvas = document.getElementById("geoCanvas");
const ctx = canvas.getContext("2d");

const emptyState = document.getElementById("emptyState");

const stateInput = document.getElementById("stateInput");
const districtInput = document.getElementById("districtInput");
const addressInput = document.getElementById("addressInput");

const latInput = document.getElementById("latInput");
const lngInput = document.getElementById("lngInput");

const mapStyle = document.getElementById("mapStyle");

const mapWidth = document.getElementById("mapWidth");
const textOpacity = document.getElementById("textOpacity");
const mapOpacity = document.getElementById("mapOpacity");

const titleSize = document.getElementById("titleSize");
const detailsSize = document.getElementById("detailsSize");
const stampHeight = document.getElementById("stampHeight");

const dateInput = document.getElementById("dateInput");
const timeInput = document.getElementById("timeInput");

let sourceImage = null;


/* =========================================================
   DEFAULT DATE
   ========================================================= */

const now = new Date();

dateInput.value =
  now.getFullYear() +
  "-" +
  String(now.getMonth()+1).padStart(2,"0") +
  "-" +
  String(now.getDate()).padStart(2,"0");


/* =========================================================
   IMAGE LOADING
   ========================================================= */

function loadImage(file){

  if(!file) return;

  if(!file.type.match(/^image\/(jpeg|png|webp)$/)){
    alert("Please choose a JPG, PNG or WebP image.");
    return;
  }

  const reader = new FileReader();

  reader.onload = function(e){

    const img = new Image();

    img.onload = function(){

      sourceImage = img;

      emptyState.style.display = "none";
      canvas.style.display = "block";

      draw();

    };

    img.onerror = function(){

      alert("Could not open this image. Try JPG, PNG or WebP.");

    };

    img.src = e.target.result;

  };

  reader.readAsDataURL(file);
}


/* =========================================================
   FILE INPUTS
   ========================================================= */

imageInput.addEventListener("change",function(){

  loadImage(this.files[0]);

});

imageInput2.addEventListener("change",function(){

  loadImage(this.files[0]);

});


/* =========================================================
   FORMAT DATE
   ========================================================= */

function formatDate(){

  if(!dateInput.value){
    return "";
  }

  const parts = dateInput.value.split("-");

  return (
    parts[2] +
    "/" +
    parts[1] +
    "/" +
    parts[0]
  );

}


/* =========================================================
   FORMAT TIME
   ========================================================= */

function formatTime(){

  if(!timeInput.value){
    return "";
  }

  let parts = timeInput.value.split(":");

  let hour = parseInt(parts[0],10);
  let minute = parts[1];

  const suffix = hour >= 12 ? "PM" : "AM";

  hour = hour % 12;

  if(hour === 0){
    hour = 12;
  }

  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    ":00 " +
    suffix
  );

}


/* =========================================================
   WRAP TEXT
   ========================================================= */

function wrapText(text,maxWidth,font){

  ctx.font = font;

  const words = text.split(/\s+/);
  const lines = [];

  let line = "";

  words.forEach(word => {

    const test =
      line.length
      ? line + " " + word
      : word;

    if(ctx.measureText(test).width > maxWidth && line){

      lines.push(line);

      line = word;

    }else{

      line = test;

    }

  });

  if(line){
    lines.push(line);
  }

  return lines;

}


/* =========================================================
   DRAW MAP
   ========================================================= */

function drawMap(x,y,w,h){

  let style = mapStyle.value;

  if(style === "dark"){

    ctx.fillStyle = "#1c252d";
    ctx.fillRect(x,y,w,h);

  }else if(style === "satellite"){

    ctx.fillStyle = "#30482e";
    ctx.fillRect(x,y,w,h);

  }else{

    ctx.fillStyle = "#dfe7d7";
    ctx.fillRect(x,y,w,h);

  }

  /* roads */

  ctx.lineWidth = Math.max(2,w/60);

  ctx.strokeStyle =
    style === "dark"
    ? "#56636d"
    : "#ffffff";

  ctx.beginPath();

  ctx.moveTo(
    x + w * .05,
    y + h * .75
  );

  ctx.lineTo(
    x + w * .38,
    y + h * .52
  );

  ctx.lineTo(
    x + w * .68,
    y + h * .57
  );

  ctx.lineTo(
    x + w * .98,
    y + h * .25
  );

  ctx.stroke();


  ctx.strokeStyle =
    style === "dark"
    ? "#48545d"
    : "#f0d9a6";

  ctx.lineWidth = Math.max(2,w/85);

  ctx.beginPath();

  ctx.moveTo(
    x + w * .1,
    y + h * .15
  );

  ctx.lineTo(
    x + w * .32,
    y + h * .42
  );

  ctx.lineTo(
    x + w * .48,
    y + h * .9
  );

  ctx.stroke();


  /* secondary roads */

  ctx.strokeStyle =
    style === "dark"
    ? "#3c474f"
    : "#f7f7f7";

  ctx.lineWidth = Math.max(1,w/130);

  for(let i=0;i<5;i++){

    ctx.beginPath();

    ctx.moveTo(
      x + w * (0.05 + i*.18),
      y + h
    );

    ctx.lineTo(
      x + w * (0.35 + i*.1),
      y
    );

    ctx.stroke();

  }


  /* location marker */

  const cx = x + w*.55;
  const cy = y + h*.48;

  ctx.beginPath();

  ctx.fillStyle = "#1976d2";

  ctx.arc(
    cx,
    cy,
    Math.max(6,w*.055),
    0,
    Math.PI*2
  );

  ctx.fill();

  ctx.beginPath();

  ctx.fillStyle = "#fff";

  ctx.arc(
    cx,
    cy,
    Math.max(2,w*.022),
    0,
    Math.PI*2
  );

  ctx.fill();


  /* map label */

  ctx.fillStyle =
    style === "dark"
    ? "rgba(0,0,0,.65)"
    : "rgba(255,255,255,.88)";

  ctx.fillRect(
    x+7,
    y+h-30,
    Math.min(w-14,150),
    22
  );

  ctx.font = Math.max(10,w*.075) + "px Arial";

  ctx.fillStyle =
    style === "dark"
    ? "#fff"
    : "#333";

  ctx.fillText(
    districtInput.value || "Location",
    x+13,
    y+h-14
  );

}


/* =========================================================
   DRAW GEO TAG
   ========================================================= */

function draw(){

  if(!sourceImage){
    return;
  }

  const img = sourceImage;

  const imgW = img.naturalWidth;
  const imgH = img.naturalHeight;

  const cardH =
    Number(stampHeight.value);

  canvas.width = imgW;
  canvas.height = imgH + cardH;

  /* Main photo */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  ctx.drawImage(
    img,
    0,
    0,
    imgW,
    imgH
  );


  /* =======================================================
     GEO CARD
     ======================================================= */

  ctx.fillStyle = "rgba(0,0,0,.78)";

  ctx.fillRect(
    0,
    imgH,
    imgW,
    cardH
  );


  const pad = Math.max(22,imgW*.025);

  const mapW =
    Math.min(
      Number(mapWidth.value),
      imgW*.28
    );

  const mapH =
    cardH - pad*2;

  const mapX = pad;
  const mapY = imgH + pad;


  /* Map */

  ctx.save();

  ctx.globalAlpha =
    Number(mapOpacity.value)/100;

  drawMap(
    mapX,
    mapY,
    mapW,
    mapH
  );

  ctx.restore();


  /* =======================================================
     TEXT AREA
     ======================================================= */

  const textX =
    mapX +
    mapW +
    pad;

  const textWidth =
    imgW -
    textX -
    pad;


  ctx.save();

  ctx.globalAlpha =
    Number(textOpacity.value)/100;


  /* Title */

  const title =
    [
      districtInput.value,
      stateInput.value,
      "India"
    ]
    .filter(Boolean)
    .join(", ");


  const titlePx =
    Number(titleSize.value);

  const titleFont =
    "700 " +
    titlePx +
    "px Arial";

  ctx.font = titleFont;
  ctx.fillStyle = "#fff";


  let titleLines =
    wrapText(
      title,
      textWidth,
      titleFont
    );


  let y =
    imgH +
    pad +
    titlePx;


  titleLines
    .slice(0,2)
    .forEach(line => {

      ctx.fillText(
        line,
        textX,
        y
      );

      y += titlePx * 1.15;

    });


  /* Address */

  const detailPx =
    Number(detailsSize.value);

  const detailFont =
    "500 " +
    detailPx +
    "px Arial";

  ctx.font = detailFont;

  ctx.fillStyle = "#e6e6e6";


  const address =
    addressInput.value.trim();


  const addressLines =
    wrapText(
      address,
      textWidth,
      detailFont
    );


  y += 3;


  addressLines
    .slice(0,4)
    .forEach(line => {

      ctx.fillText(
        line,
        textX,
        y
      );

      y += detailPx * 1.25;

    });


  /* Coordinates */

  const lat =
    latInput.value || "0.000000";

  const lng =
    lngInput.value || "0.000000";


  ctx.font =
    "600 " +
    detailPx +
    "px Arial";

  ctx.fillStyle = "#fff";


  y += 5;

  ctx.fillText(
    "Lat " + lat + "°  Long " + lng + "°",
    textX,
    y
  );


  /* Date */

  y += detailPx * 1.3;

  ctx.fillText(
    formatDate() +
    " " +
    formatTime(),
    textX,
    y
  );


  ctx.restore();


  /* =======================================================
     CAMERA / GPS ICON
     ======================================================= */

  const logoSize =
    Math.min(
      58,
      cardH*.23
    );

  const logoX =
    imgW -
    pad -
    logoSize;

  const logoY =
    imgH +
    pad;


  /* blue rounded square */

  ctx.save();

  ctx.fillStyle = "#1976d2";

  roundRect(
    ctx,
    logoX,
    logoY,
    logoSize,
    logoSize,
    logoSize*.22
  );

  ctx.fill();


  /* camera body */

  ctx.fillStyle = "#fff";

  roundRect(
    ctx,
    logoX + logoSize*.2,
    logoY + logoSize*.34,
    logoSize*.6,
    logoSize*.4,
    logoSize*.08
  );

  ctx.fill();


  /* lens */

  ctx.beginPath();

  ctx.fillStyle = "#1976d2";

  ctx.arc(
    logoX + logoSize*.5,
    logoY + logoSize*.54,
    logoSize*.11,
    0,
    Math.PI*2
  );

  ctx.fill();


  /* camera top */

  ctx.fillStyle = "#fff";

  roundRect(
    ctx,
    logoX + logoSize*.32,
    logoY + logoSize*.25,
    logoSize*.2,
    logoSize*.1,
    logoSize*.03
  );

  ctx.fill();

  ctx.restore();


  /* =======================================================
     MAP / IMAGE CREDIT
     ======================================================= */

  ctx.font =
    Math.max(9,imgW*.012) +
    "px Arial";

  ctx.fillStyle =
    "rgba(255,255,255,.65)";

  ctx.fillText(
    "© OpenStreetMap",
    mapX + 7,
    mapY + mapH - 7
  );

}


/* =========================================================
   ROUNDED RECTANGLE
   ========================================================= */

function roundRect(
  ctx,
  x,
  y,
  width,
  height,
  radius
){

  ctx.beginPath();

  ctx.moveTo(
    x + radius,
    y
  );

  ctx.lineTo(
    x + width - radius,
    y
  );

  ctx.quadraticCurveTo(
    x + width,
    y,
    x + width,
    y + radius
  );

  ctx.lineTo(
    x + width,
    y + height - radius
  );

  ctx.quadraticCurveTo(
    x + width,
    y + height,
    x + width - radius,
    y + height
  );

  ctx.lineTo(
    x + radius,
    y + height
  );

  ctx.quadraticCurveTo(
    x,
    y + height,
    x,
    y + height - radius
  );

  ctx.lineTo(
    x,
    y + radius
  );

  ctx.quadraticCurveTo(
    x,
    y,
    x + radius,
    y
  );

  ctx.closePath();

}
